<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LATHISH VAULT</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0912">
<link rel="stylesheet" href="/assets/css/theme.css">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="floaters" id="floaters" aria-hidden="true"></div>
<a class="skip" href="#main">Skip to content</a>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar" aria-label="Primary">
    <div class="brand"><svg class="ico" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-vault"/></svg><div>LATHISH VAULT<small>Your Data. Your Assets. Your Control.</small></div></div>
    <nav class="nav" aria-label="Main">
      <a href="#/dashboard" data-nav="dashboard"><svg class="ico" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-home"/></svg><span>Dashboard</span></a>
      <a href="#/files" data-nav="files"><svg class="ico" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-folder"/></svg><span>All Files</span></a>
      <a href="#/recent" data-nav="recent"><svg class="ico" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-clock"/></svg><span>Recent</span></a>
      <a href="#/favorites" data-nav="favorites"><svg class="ico" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-star"/></svg><span>Favorites</span></a>
      <a href="#/trash" data-nav="trash"><svg class="ico" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-trash"/></svg><span>Trash</span></a>
      <a href="#/analytics" data-nav="analytics"><svg class="ico" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-chart"/></svg><span>Storage Analytics</span></a>
      <a href="#/settings" data-nav="settings"><svg class="ico" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-sliders"/></svg><span>Account</span></a>
      <a href="#/security" data-nav="security"><svg class="ico" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-shield"/></svg><span>Security</span></a>
    </nav>
    <div class="side-storage glass" id="side-storage" aria-live="polite"></div>
  </aside>
  <div class="main-col">
    <header class="topbar">
      <button class="btn icon ghost" id="menu-btn" type="button" aria-label="Toggle navigation" aria-controls="sidebar"><svg class="ico" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-menu"/></svg></button>
      <div class="search"><svg class="ico" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-search"/></svg>
        <label class="sr-only" for="search">Search files</label><input class="input" id="search" type="search" placeholder="Search all files…" autocomplete="off" maxlength="100"></div>
      <div class="spacer"></div>
      <button class="btn primary" id="upload-btn" type="button"><svg class="ico" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-upload"/></svg><span class="lbl">Upload</span></button>
      <input id="file-input" type="file" multiple hidden>
      <div class="pop-wrap"><button class="btn icon ghost" id="notif-btn" type="button" aria-label="Notifications" aria-expanded="false" aria-controls="notif-pop"><svg class="ico" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-bell"/></svg><i class="badge" id="notif-badge" hidden></i></button>
        <div class="popover glass" id="notif-pop" hidden></div></div>
      <div class="pop-wrap"><button class="btn icon ghost" id="acct-btn" type="button" aria-label="Account menu" aria-expanded="false" aria-controls="acct-pop"><svg class="ico" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-user"/></svg></button>
        <div class="popover glass" id="acct-pop" hidden></div></div>
    </header>
    <div class="ticker" id="ticker" aria-label="Simulated market ticker"></div>
    <main id="main" tabindex="-1" aria-live="polite"></main>
  </div>
</div>
<div class="uploads glass" id="uploads" hidden aria-label="Uploads"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="ctx glass" id="ctx" role="menu" hidden></div>
<div class="dropzone" id="dropzone" aria-hidden="true">Drop files to upload</div>
<script type="module" src="/assets/js/app.js"></script>
</body>
</html>
